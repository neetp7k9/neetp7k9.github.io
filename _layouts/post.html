---
layout: default
---
<article class="article wrap">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">All posts</a>
  <header class="article-header"><div class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>{% for tag in page.tags %}<span>{{ tag | escape }}</span>{% endfor %}</div><h1>{{ page.title | escape }}</h1>{% if page.summary %}<p class="article-summary">{{ page.summary | escape }}</p>{% endif %}<p class="article-author">By Pu An Yang</p></header>
  <div class="prose">{{ content }}</div>
  <footer class="article-footer"><a class="text-link" href="{{ '/blog/' | relative_url }}">Back to the blog</a><a class="text-link" href="https://github.com/neetp7k9">Find me on GitHub</a></footer>
</article>
